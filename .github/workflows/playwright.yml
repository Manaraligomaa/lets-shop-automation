name: Playwright
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# Every run logs in to the same test account, and each login empties its cart, so runs wait for each other.
concurrency:
  group: lets-shop-test-account
  cancel-in-progress: false
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx playwright test --retries=0
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
