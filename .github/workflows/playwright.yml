name: Playwright
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# Every run logs in to the same test account, and each login empties its cart, so runs wait for each other.
concurrency:
  group: lets-shop-test-account
  cancel-in-progress: false
jobs:
  playwright:
    runs-on: ubuntu-latest
    # Browsers and their system packages come preinstalled (installing them took 15 minutes on the Ubuntu mirror).
    # Keep the tag equal to the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx playwright test --retries=0
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
